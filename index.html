<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM24 Moneyball</title>
<style>
  :root{--bg:#0b1120;--card:#1e293b;--accent:#22d3ee;--text:#e2e8f0;--good:#4ade80;--mid:#facc15;--bad:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;line-height:1.5}
  .container{max-width:1300px;margin:0 auto}
  h1{font-size:1.8rem;margin-bottom:6px}
  .card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid #334155}
  select,textarea,input[type=file],input[type=checkbox]{background:#0f172a;border:1px solid #475569;color:var(--text);padding:10px;border-radius:8px;font-size:15px}
  select,textarea,input[type=file]{width:100%;margin-top:8px}
  button{background:var(--accent);color:#0f172a;border:none;padding:13px 28px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:12px;font-size:15px}
  button:hover{filter:brightness(1.1)}
  .top3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
  .player-card{background:#0f172a;border-radius:10px;padding:16px;border-left:5px solid var(--accent)}
  .player-card h3{font-size:1.15rem;margin-bottom:4px}
  .score{font-size:1.7rem;font-weight:800;margin:8px 0}
  .score-high{color:var(--good)}.score-mid{color:var(--mid)}.score-low{color:var(--bad)}
  .stats-list{font-size:13px;margin-top:8px;opacity:.9}
  .info{font-size:13px;opacity:.75;margin:8px 0}
</style>
</head>
<body>
<div class="container">
  <h1>⚽ FM24 Moneyball</h1>
  <p style="opacity:.8;margin-bottom:20px">Filtrado por posición + comparación con tu plantilla</p>

  <div class="card">
    <h2>1. Elige el rol</h2>
    <select id="roleSelect">
      <option value="GK">Portero Cierre – Ataque</option>
      <option value="WB">Carrilero – Apoyo</option>
      <option value="CB">Defensa con Toque – Defensa</option>
      <option value="DM">Pivote Organizador – Defensa</option>
      <option value="CM">Centrocampista – Apoyo</option>
      <option value="AP">Organizador Adelantado – Ataque</option>
      <option value="IF">Delantero Interior – Apoyo</option>
      <option value="F9">Falso Nueve – Apoyo</option>
    </select>
  </div>

  <div class="card">
    <h2>2. Datos</h2>
    
    <p class="info">Archivo del <strong>mercado</strong> (jugadores a evaluar)</p>
    <input type="file" id="fileInput" accept=".html,.htm,.csv,.txt">
    
    <p class="info" style="margin-top:16px">Archivo de tu <strong>plantilla actual</strong> (opcional)</p>
    <input type="file" id="squadInput" accept=".html,.htm,.csv,.txt">
    
    <div style="margin:16px 0;display:flex;align-items:center;gap:10px">
      <input type="checkbox" id="useDiscard" checked style="width:18px;height:18px">
      <label for="useDiscard">Aplicar filtros de descarte previo</label>
    </div>

    <textarea id="rawData" rows="6" placeholder="O pega aquí la tabla del mercado..."></textarea>
    <button onclick="calculate()">Calcular Top 3</button>
  </div>

  <div class="card">
    <h2>3. Resultados</h2>
    <div id="results"><p style="opacity:.6">Aquí aparecerán los resultados</p></div>
  </div>
</div>
