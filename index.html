<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM24 Moneyball – Versión Estable</title>
<style>
  :root{--bg:#0b1120;--card:#1e293b;--accent:#22d3ee;--text:#e2e8f0;--good:#4ade80;--mid:#facc15;--bad:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px;line-height:1.5}
  .container{max-width:1300px;margin:0 auto}
  h1{font-size:1.8rem;margin-bottom:6px}
  .card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid #334155}
  select,textarea,input[type=file]{width:100%;background:#0f172a;border:1px solid #475569;color:var(--text);padding:12px;border-radius:8px;font-size:15px;margin-top:8px}
  button{background:var(--accent);color:#0f172a;border:none;padding:13px 28px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:12px;font-size:15px}
  button:hover{filter:brightness(1.1)}
  .top3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
  .player-card{background:#0f172a;border-radius:10px;padding:16px;border-left:5px solid var(--accent)}
  .player-card h3{font-size:1.15rem;margin-bottom:4px}
  .score{font-size:1.7rem;font-weight:800;margin:8px 0}
  .score-high{color:var(--good)}.score-mid{color:var(--mid)}.score-low{color:var(--bad)}
  .stats-list{font-size:13px;margin-top:8px;opacity:.9}
  .stats-list div{margin:2px 0}
  .role-desc{font-size:13px;opacity:.75;margin-top:8px}
  .info{font-size:13px;opacity:.7;margin-top:8px}
</style>
</head>
<body>
<div class="container">
  <h1>⚽ FM24 Moneyball</h1>
  <p style="opacity:.8;margin-bottom:20px">Versión estable – nombres + scoring corregido</p>

  <div class="card">
    <h2>1. Elige el rol</h2>
    <select id="roleSelect">
      <option value="GK">Portero Cierre – Ataque</option>
      <option value="WB">Carrilero – Apoyo</option>
      <option value="CB">Defensa con Toque – Defensa</option>
      <option value="DM">Pivote Organizador – Defensa</option>
      <option value="CM">Centrocampista – Apoyo</option>
      <option value="AP">Organizador Adelantado – Ataque</option>
      <option value="IF">Delantero Interior – Apoyo</option>
      <option value="F9" selected>Falso Nueve – Apoyo</option>
    </select>
    <div id="roleDescription" class="role-desc"></div>
  </div>

  <div class="card">
    <h2>2. Archivo con TODAS las estadísticas</h2>
    <p class="info">Sube el .html de FM (Print → Web Page)</p>
    <input type="file" id="fileInput" accept=".html,.htm,.csv,.txt">
    <textarea id="rawData" rows="6" placeholder="O pega el HTML aquí..."></textarea>
    <button onclick="calculate()">Calcular Top 3</button>
  </div>

  <div class="card">
    <h2>3. Resultados</h2>
    <div id="results"><p style="opacity:.6">Aquí saldrán las 3 mejores opciones.</p></div>
  </div>
</div>

<script>
const roleProfiles = {
  GK: {
    name: "Portero Cierre – Ataque",
    description: "xG evitados + distribución + seguridad",
    metrics: [
      {keys:["xg evitados/90","goles esperados evitados/90","xg evitados"], weight:2.2, isPercent:false},
      {keys:["ratio de paradas","ratio paradas"], weight:1.6, isPercent:true},
      {keys:["pases completados/90"], weight:1.5, isPercent:false},
      {keys:["pases progresivos/90"], weight:1.3, isPercent:false},
      {keys:["posesiones perdidas/90"], weight:-1.4, isPercent:false},
      {keys:["errores que costaron goles"], weight:-2.5, isPercent:false}
    ]
  },
  CB: {
    name: "Defensa con Toque – Defensa",
    description: "Salida limpia + recuperación + cero errores",
    metrics: [
      {keys:["pases progresivos/90"], weight:1.9, isPercent:false},
      {keys:["% pase","ratio de pases completados","% pase"], weight:1.4, isPercent:true},
      {keys:["rob/90","posesiones ganadas/90"], weight:1.6, isPercent:false},
      {keys:["ent p","entradas clave/90"], weight:1.3, isPercent:false},
      {keys:["presiones completadas/90","pres int"], weight:1.2, isPercent:false},
      {keys:["errores que costaron goles"], weight:-2.8, isPercent:false},
      {keys:["posesiones perdidas/90"], weight:-1.5, isPercent:false}
    ]
  },
  // ... (el resto de roles se mantienen con la misma lógica)
  WB: {
    name: "Carrilero – Apoyo",
    description: "Presión + progresión + centros + intensidad",
    metrics: [
      {keys:["presiones completadas/90","pres int"], weight:2.0, isPercent:false},
      {keys:["pases progresivos/90"], weight:1.7, isPercent:false},
      {keys:["cen-ab","centros completados en juego abierto/90"], weight:1.5, isPercent:false},
      {keys:["distancia cubierta/90"], weight:1.3, isPercent:false},
      {keys:["% pase"], weight:1.2, isPercent:true},
      {keys:["posesiones perdidas/90"], weight:-1.3, isPercent:false}
    ]
  },
  DM: {
    name: "Pivote Organizador – Defensa",
    description: "Control + recuperación + pases seguros",
    metrics: [
      {keys:["pases progresivos/90"], weight:1.8, isPercent:false},
      {keys:["% pase"], weight:1.5, isPercent:true},
      {keys:["rob/90","posesiones ganadas/90"], weight:1.7, isPercent:false},
      {keys:["presiones completadas/90"], weight:1.4, isPercent:false},
      {keys:["pases clave/90"], weight:1.2, isPercent:false},
      {keys:["posesiones perdidas/90"], weight:-1.6, isPercent:false}
    ]
  },
  CM: {
    name: "Centrocampista – Apoyo",
    description: "Intensidad + presión + progresión",
    metrics: [
      {keys:["presiones completadas/90"], weight:2.0, isPercent:false},
      {keys:["pases progresivos/90"], weight:1.7, isPercent:false},
      {keys:["distancia cubierta/90"], weight:1.4, isPercent:false},
      {keys:["rob/90"], weight:1.3, isPercent:false},
      {keys:["pases clave/90"], weight:1.2, isPercent:false},
      {keys:["posesiones perdidas/90"], weight:-1.3, isPercent:false}
    ]
  },
  AP: {
    name: "Organizador Adelantado – Ataque",
    description: "Creación + progresión + llegada",
    metrics: [
      {keys:["pases clave/90"], weight:2.2, isPercent:false},
      {keys:["ocasiones claras creadas/90"], weight:2.0, isPercent:false},
      {keys:["pases progresivos/90"], weight:1.6, isPercent:false},
      {keys:["xg","goles esperados"], weight:1.4, isPercent:false},
      {keys:["presiones completadas/90"], weight:1.2, isPercent:false},
      {keys:["posesiones perdidas/90"], weight:-1.3, isPercent:false}
    ]
  },
  IF: {
    name: "Delantero Interior – Apoyo",
    description: "Llegada + creación + presión",
    metrics: [
      {keys:["ocasiones claras creadas/90"], weight:2.0, isPercent:false},
      {keys:["pases clave/90"], weight:1.8, isPercent:false},
      {keys:["xg","goles esperados"], weight:1.6, isPercent:false},
      {keys:["pases progresivos/90"], weight:1.4, isPercent:false},
      {keys:["presiones completadas/90"], weight:1.3, isPercent:false},
      {keys:["posesiones perdidas/90"], weight:-1.3, isPercent:false}
    ]
  },
  F9: {
    name: "Falso Nueve – Apoyo",
    description: "Creación desde la punta + asociación + presión alta",
    metrics: [
      {keys:["ocasiones claras creadas/90"], weight:2.3, isPercent:false},
      {keys:["pases clave/90"], weight:2.1, isPercent:false},
      {keys:["pases progresivos/90"], weight:1.6, isPercent:false},
      {keys:["xg","goles esperados"], weight:1.5, isPercent:false},
      {keys:["presiones completadas/90"], weight:1.4, isPercent:false},
      {keys:["posesiones perdidas/90"], weight:-1.5, isPercent:false},
      {keys:["reg/90","regates"], weight:-0.8, isPercent:false}
    ]
  }
};

document.getElementById('roleSelect').addEventListener('change', function() {
  document.getElementById('roleDescription').textContent = roleProfiles[this.value].description;
});
document.getElementById('roleSelect').dispatchEvent(new Event('change'));

function normalize(str) {
  return (str || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\/\%]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function findValue(player, possibleKeys) {
  const playerKeys = Object.keys(player);
  for (const target of possibleKeys) {
    const normTarget = normalize(target);
    for (const pk of playerKeys) {
      const normPk = normalize(pk);
      if (normPk.includes(normTarget) || normTarget.includes(normPk)) {
        let raw = String(player[pk]).replace(',', '.').replace(/[^\d.-]/g, '');
        let val = parseFloat(raw);
        if (!isNaN(val)) return {value: val, column: pk};
      }
    }
  }
  return {value: 0, column: null};
}

function getPlayerName(p) {
  // 1. Prioridad máxima a "Nombre"
  if (p['Nombre'] && p['Nombre'].trim().length > 2) {
    return p['Nombre'].replace(/\s+/g, ' ').trim();
  }
  // 2. Otras posibilidades
  for (const key of ['Name', 'Player', 'Jugador', 'Inf']) {
    if (p[key] && p[key].trim().length > 2 && p[key] !== '-' && p[key] !== '--') {
      return p[key].replace(/\s+/g, ' ').trim();
    }
  }
  // 3. Buscar cualquier celda que parezca un nombre
  for (const key of Object.keys(p)) {
    const val = (p[key] || '').trim();
    if (val.length > 4 && /[a-záéíóúñ]/i.test(val) && !/^\d+([.,]\d+)?%?$/.test(val) && !val.includes('€') && !val.includes('/')) {
      return val;
    }
  }
  return 'Desconocido';
}

function calculate() {
  const raw = document.getElementById('rawData').value.trim();
  if (!raw) return alert('Sube o pega el archivo');

  const players = parseTable(raw);
  if (players.length === 0) return alert('No se detectaron jugadores');

  const roleKey = document.getElementById('roleSelect').value;
  const profile = roleProfiles[roleKey];

  const scored = players.map(p => {
    let score = 0;
    const details = [];

    profile.metrics.forEach(m => {
      const result = findValue(p, m.keys);
      let val = result.value;

      // Normalización de porcentajes
      if (m.isPercent && val > 1) {
        val = val / 10; // 93% → 9.3
      }

      // Límite de impacto de una sola métrica
      const contribution = Math.max(-25, Math.min(35, val * m.weight));
      score += contribution;

      if (Math.abs(m.weight) >= 1.3 && val !== 0) {
        details.push(`${result.column || m.keys[0]}: ${result.value.toFixed(2)}`);
      }
    });

    return {
      name: getPlayerName(p),
      club: p.Club || '',
      age: p.Edad || p.Age || '',
      pos: p.Posición || p.Position || '',
      score: Math.round(score * 10) / 10,
      details: details.slice(0, 5)
    };
  });

  scored.sort((a, b) => b.score - a.score);
  const top3 = scored.filter(p => p.name !== 'Desconocido').slice(0, 3);

  let html = `<p><strong>${profile.name}</strong> · ${players.length} jugadores analizados</p><div class="top3">`;
  top3.forEach((p, i) => {
    const cls = p.score >= 25 ? 'score-high' : p.score >= 15 ? 'score-mid' : 'score-low';
    html += `<div class="player-card">
      <div style="font-size:12px;opacity:.6">#${i+1}</div>
      <h3>${p.name}</h3>
      <div style="font-size:13px;opacity:.8">${p.age ? p.age + ' años' : ''} ${p.pos ? '· ' + p.pos : ''} ${p.club ? '· ' + p.club : ''}</div>
      <div class="score ${cls}">${p.score}</div>
      <div class="stats-list">${p.details.map(d => `<div>${d}</div>`).join('')}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('results').innerHTML = html;
}

function parseTable(raw) {
  if (raw.includes('<table') || raw.includes('<tr')) {
    const div = document.createElement('div');
    div.innerHTML = raw;
    const rows = [...div.querySelectorAll('tr')];
    if (rows.length < 2) return [];

    // Buscar la fila de encabezados que contenga "Nombre"
    let headerRow = rows.find(r => r.textContent.includes('Nombre')) || rows[0];
    const headers = [...headerRow.querySelectorAll('th, td')].map(c => c.textContent.trim());
    const start = rows.indexOf(headerRow) + 1;

    return rows.slice(start).map(row => {
      const cells = [...row.querySelectorAll('td')];
      const p = {};
      headers.forEach((h, i) => p[h] = cells[i] ? cells[i].textContent.trim() : '');
      return p;
    }).filter(p => Object.values(p).some(v => v && v.length > 2));
  }

  // Fallback
  const lines = raw.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const sep = lines[0].includes('\t') ? '\t' : (lines[0].includes(';') ? ';' : ',');
  const headers = lines[0].split(sep).map(h => h.trim());
  return lines.slice(1).map(line => {
    const cells = line.split(sep);
    const p = {};
    headers.forEach((h, i) => p[h] = (cells[i] || '').trim());
    return p;
  });
}

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => document.getElementById('rawData').value = ev.target.result;
  reader.readAsText(file, 'UTF-8');
});
</script>
</body>
</html>
