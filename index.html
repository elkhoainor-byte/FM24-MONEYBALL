<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM24 Moneyball</title>
<style>
  :root{--bg:#0b1120;--card:#1e293b;--accent:#22d3ee;--text:#e2e8f0;--good:#4ade80;--mid:#facc15;--bad:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding:20px}
  .container{max-width:1300px;margin:0 auto}
  h1{font-size:1.8rem;margin-bottom:6px}
  .card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid #334155}
  select,textarea,input[type=file]{width:100%;background:#0f172a;border:1px solid #475569;color:var(--text);padding:12px;border-radius:8px;font-size:15px;margin-top:8px}
  button{background:var(--accent);color:#0f172a;border:none;padding:13px 28px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:12px;font-size:15px}
  .top3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
  .player-card{background:#0f172a;border-radius:10px;padding:16px;border-left:5px solid var(--accent)}
  .player-card h3{font-size:1.15rem;margin-bottom:4px}
  .score{font-size:1.7rem;font-weight:800;margin:8px 0}
  .score-high{color:var(--good)}.score-mid{color:var(--mid)}.score-low{color:var(--bad)}
  .stats-list{font-size:13px;margin-top:8px;opacity:.9}
</style>
</head>
<body>
<div class="container">
  <h1>⚽ FM24 Moneyball</h1>
  <p style="opacity:.8;margin-bottom:20px">Prueba pegando la tabla (no el archivo .html)</p>

  <div class="card">
    <h2>1. Elige el rol</h2>
    <select id="roleSelect">
      <option value="GK">Portero Cierre – Ataque</option>
      <option value="WB">Carrilero – Apoyo</option>
      <option value="CB">Defensa con Toque – Defensa</option>
      <option value="DM">Pivote Organizador – Defensa</option>
      <option value="CM">Centrocampista – Apoyo</option>
      <option value="AP">Organizador Adelantado – Ataque</option>
      <option value="IF">Delantero Interior – Apoyo</option>
      <option value="F9" selected>Falso Nueve – Apoyo</option>
    </select>
  </div>

  <div class="card">
    <h2>2. Datos</h2>
    <p style="font-size:13px;opacity:.7;margin-bottom:8px">
      Recomendado: Abre el .html en el navegador → selecciona toda la tabla → Copia → Pega aquí
    </p>
    <input type="file" id="fileInput" accept=".html,.htm,.csv,.txt">
    <textarea id="rawData" rows="8" placeholder="Pega aquí la tabla..."></textarea>
    <button onclick="calculate()">Calcular Top 3</button>
  </div>

  <div class="card">
    <h2>3. Resultados</h2>
    <div id="results"></div>
  </div>
</div>

<script>
const roleProfiles = {
  GK: {
    name: "Portero Cierre – Ataque",
    description: "Solo porteros (POR) · xG evitados + distribución + seguridad",
    positions: ["POR"],
    metrics: [
      {keys:["xg evitados","goles esperados evitados"], weight:2.2},
      {keys:["ratio de paradas","ratio paradas"], weight:1.5},
      {keys:["pases completados/90","pases completados"], weight:1.4},
      {keys:["pases progresivos/90","pases progresivos"], weight:1.3},
      {keys:["posesiones perdidas"], weight:-1.4},
      {keys:["errores que costaron goles"], weight:-2.5}
    ]
  },
  WB: {
    name: "Carrilero – Apoyo",
    description: "Laterales / Carrileros (DF) · Presión + progresión + centros",
    positions: ["DF"],
    metrics: [
      {keys:["presiones"], weight:2.0},
      {keys:["pases progresivos"], weight:1.7},
      {keys:["centros"], weight:1.5},
      {keys:["distancia cubierta"], weight:1.3},
      {keys:["% pase"], weight:1.2}
    ]
  },
  CB: {
    name: "Defensa con Toque – Defensa",
    description: "Centrales (DF) · Salida limpia + recuperación + cero errores",
    positions: ["DF"],
    metrics: [
      {keys:["pases progresivos"], weight:1.9},
      {keys:["% pase","ratio de pases"], weight:1.3},
      {keys:["rob/90","posesiones ganadas"], weight:1.6},
      {keys:["ent p","entradas clave"], weight:1.3},
      {keys:["presiones"], weight:1.2},
      {keys:["errores que costaron goles"], weight:-2.8}
    ]
  },
  DM: {
    name: "Pivote Organizador – Defensa",
    description: "Pivotes / Mediocentros defensivos (ME)",
    positions: ["ME"],
    metrics: [
      {keys:["pases progresivos"], weight:1.8},
      {keys:["% pase"], weight:1.5},
      {keys:["rob/90","posesiones ganadas"], weight:1.7},
      {keys:["presiones"], weight:1.4},
      {keys:["pases clave"], weight:1.2}
    ]
  },
  CM: {
    name: "Centrocampista – Apoyo",
    description: "Centrocampistas (MC)",
    positions: ["MC"],
    metrics: [
      {keys:["presiones"], weight:2.0},
      {keys:["pases progresivos"], weight:1.7},
      {keys:["distancia cubierta"], weight:1.4},
      {keys:["rob/90"], weight:1.3},
      {keys:["pases clave"], weight:1.2}
    ]
  },
  AP: {
    name: "Organizador Adelantado – Ataque",
    description: "Mediapuntas / Organizadores (MP)",
    positions: ["MP"],
    metrics: [
      {keys:["pases clave"], weight:2.2},
      {keys:["ocasiones claras"], weight:2.0},
      {keys:["pases progresivos"], weight:1.6},
      {keys:["xg","goles esperados"], weight:1.4}
    ]
  },
  IF: {
    name: "Delantero Interior – Apoyo",
    description: "Extremos / Interiores (MP)",
    positions: ["MP"],
    metrics: [
      {keys:["ocasiones claras"], weight:2.0},
      {keys:["pases clave"], weight:1.8},
      {keys:["xg"], weight:1.6},
      {keys:["pases progresivos"], weight:1.4},
      {keys:["presiones"], weight:1.3}
    ]
  },
  F9: {
    name: "Falso Nueve – Apoyo",
    description: "Delanteros (DL)",
    positions: ["DL"],
    metrics: [
      {keys:["ocasiones claras"], weight:2.3},
      {keys:["pases clave"], weight:2.1},
      {keys:["pases progresivos"], weight:1.6},
      {keys:["xg","goles esperados"], weight:1.5},
      {keys:["presiones"], weight:1.4}
    ]
  }
};
function normalize(s) {
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\/\%]/g,' ').replace(/\s+/g,' ').trim();
}

function findValue(p, keys) {
  for (const k of keys) {
    const nk = normalize(k);
    for (const pk of Object.keys(p)) {
      if (normalize(pk).includes(nk) || nk.includes(normalize(pk))) {
        const val = parseFloat(String(p[pk]).replace(',','.').replace(/[^\d.-]/g,''));
        if (!isNaN(val)) return {val, col: pk};
      }
    }
  }
  return {val:0, col:null};
}

function getName(p) {
  // Intento 1: columna exacta "Nombre"
  if (p['Nombre'] && p['Nombre'].trim().length > 3) return p['Nombre'].trim();

  // Intento 2: buscar cualquier valor que parezca nombre + nacionalidad
  for (const key of Object.keys(p)) {
    const v = (p[key]||'').trim();
    if (v.length > 6 && v.includes(' - ') && /[a-záéíóúñ]/i.test(v) && !v.includes('€') && !v.includes('%')) {
      return v;
    }
  }

  // Intento 3: cualquier texto largo con letras
  for (const key of Object.keys(p)) {
    const v = (p[key]||'').trim();
    if (v.length > 5 && /[a-záéíóúñ]{3,}/i.test(v) && !/^\d/.test(v) && !v.includes('€') && !v.includes('%') && !v.includes('/90')) {
      return v;
    }
  }
  return 'Desconocido';
}

function calculate() {
  const raw = document.getElementById('rawData').value.trim();
  if (!raw) return alert('Pega o sube datos');

  const players = parse(raw);
  if (players.length === 0) return alert('No se detectaron jugadores');

  const role = roleProfiles[document.getElementById('roleSelect').value];
  const scored = players.map(p => {
    let score = 0;
    const details = [];
    role.metrics.forEach(m => {
      const r = findValue(p, m.keys);
      let v = r.val;
      if (v > 50 && (normalize(r.col||'').includes('%') || normalize(r.col||'').includes('pase'))) v = v / 10;
      score += Math.max(-20, Math.min(30, v * m.weight));
      if (v !== 0 && Math.abs(m.weight) >= 1.3) details.push(`${r.col||m.keys[0]}: ${r.val.toFixed(2)}`);
    });
    return {
      name: getName(p),
      age: p.Edad || p.Age || '',
      club: p.Club || '',
      pos: p.Posición || p.Position || '',
      score: Math.round(score*10)/10,
      details
    };
  });

  scored.sort((a,b) => b.score - a.score);
  const top = scored.filter(p => p.name !== 'Desconocido').slice(0,3);

  let html = `<p><strong>${role.name}</strong> · ${players.length} jugadores</p><div class="top3">`;
  top.forEach((p,i) => {
    const cls = p.score >= 22 ? 'score-high' : p.score >= 14 ? 'score-mid' : 'score-low';
    html += `<div class="player-card">
      <div style="font-size:12px;opacity:.6">#${i+1}</div>
      <h3>${p.name}</h3>
      <div style="font-size:13px;opacity:.8">${p.age} años ${p.pos ? '· '+p.pos : ''} ${p.club ? '· '+p.club : ''}</div>
      <div class="score ${cls}">${p.score}</div>
      <div class="stats-list">${p.details.slice(0,5).map(d=>`<div>${d}</div>`).join('')}</div>
    </div>`;
  });
  document.getElementById('results').innerHTML = html + '</div>';
}

function parse(raw) {
  if (raw.includes('<table') || raw.includes('<tr')) {
    const div = document.createElement('div');
    div.innerHTML = raw;
    const rows = [...div.querySelectorAll('tr')];
    let header = rows.find(r => r.textContent.includes('Nombre') || r.textContent.includes('Name')) || rows[0];
    const headers = [...header.querySelectorAll('th,td')].map(c => c.textContent.trim());
    const start = rows.indexOf(header) + 1;
    return rows.slice(start).map(row => {
      const cells = [...row.querySelectorAll('td')];
      const obj = {};
      headers.forEach((h,i) => obj[h] = cells[i]?.textContent.trim() || '');
      return obj;
    }).filter(p => Object.values(p).some(v => v.length > 2));
  }
  // texto plano
  const lines = raw.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return [];
  const sep = lines[0].includes('\t') ? '\t' : lines[0].includes(';') ? ';' : ',';
  const headers = lines[0].split(sep).map(h => h.trim());
  return lines.slice(1).map(l => {
    const cells = l.split(sep);
    const obj = {};
    headers.forEach((h,i) => obj[h] = (cells[i]||'').trim());
    return obj;
  });
}

document.getElementById('fileInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => document.getElementById('rawData').value = ev.target.result;
  r.readAsText(f, 'UTF-8');
});
</script>
</body>
</html>
